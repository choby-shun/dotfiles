# ==========================================
# Tmux Configuration
# ==========================================

# ------------------------------------------
# 1. 核心与系统行为 (Core Behavior)
# ------------------------------------------
# 开启鼠标支持 (允许点击切窗、拖动面板边缘调整大小)
set -g mouse on

# 消除 Neovim 中按下 ESC 键的延迟 (默认500ms，设为10ms提升Vim体验)
set -sg escape-time 10


# ------------------------------------------
# 2. 终端兼容性与渲染 (Terminal & Render)
# ------------------------------------------
# 开启真彩色支持，完美适配 Catppuccin 主题与 Ghostty 渲染
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -a terminal-features '*:RGB'

# 允许 Neovim 透传光标形状控制 (Insert 模式细线 / Normal 模式方块)
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[2 q'


# ------------------------------------------
# 3. 窗口与面板管理 (Windows & Panes)
# ------------------------------------------
# 窗口和面板起始序号从 1 开始 (符合键盘物理按键直觉，离左手更近)
set -g base-index 1
setw -g pane-base-index 1

# 当关闭一个窗口时，自动重新编号剩余的窗口，保持序号连续
set -g renumber-windows on

# 动态命名格式设定: /文件夹名:运行命令 (例如 /src:nvim)
set-option -g automatic-rename-format '/#{b:pane_current_path}:#{pane_current_command}'


# ------------------------------------------
# 4. 外观主题与 UI (Theme & UI)
# ------------------------------------------
# 选中行的高亮底色 (用于 choose-tree 和复制模式)
set-window-option -g mode-style "bg=#313244,fg=#cdd6f4"

# 消除状态栏默认的刺眼绿色，换成 Catppuccin 风格的深色底边框
set-option -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# ==========================================
# 活跃窗口 (Current Window) 的独立色块设计
# ==========================================
# 视觉层级: [序号 (亮紫色)] -> [文件夹 (深灰色)] -> [命令 (浅灰色底/绿色字)]
set-window-option -g window-status-current-format "#[bg=#cba6f7,fg=#1e1e2e,bold] #{window_index} #[bg=#45475a,fg=#cdd6f4,bold] /#{b:pane_current_path} #[bg=#585b70,fg=#a6e3a1,nobold] #{pane_current_command} "

# ==========================================
# 非活跃窗口 (Inactive Window) 的独立色块设计
# ==========================================
# 视觉层级: 整体变暗，降低对视觉的干扰
set-window-option -g window-status-format "#[bg=#313244,fg=#cdd6f4] #{window_index} #[bg=#181825,fg=#a6adc8] /#{b:pane_current_path} #[bg=#11111b,fg=#7f849c] #{pane_current_command} "

# ------------------------------------------
# 5. 快捷键绑定 (Keybindings)
# ------------------------------------------
# 增强版 w 键: 树状交互视图 (增强路径的洋红高亮显示，信息密度最大化)
bind-key w choose-tree -Zw -F "#{?pane_format,#[fg=cyan]#{pane_current_command} #[fg=magenta]#{pane_current_path},#{?window_format,#[fg=green]#{window_name}#{window_flags} #[fg=cyan](#{pane_current_command}) #[fg=magenta]#{pane_current_path},#[fg=blue,bold]#{session_name} #[fg=gray](#{session_windows} 窗口)#{?session_attached, (活跃),} #[fg=gray]启动
