# ==========================================
# Tmux Configuration
# ==========================================

# ------------------------------------------
# 1. 核心与系统行为 (Core Behavior)
# ------------------------------------------
# 开启鼠标支持 (允许点击切窗、拖动面板边缘调整大小)
set -g mouse on

# 消除 Neovim 中按下 ESC 键的延迟 (默认500ms，设为10ms提升Vim体验)
set -sg escape-time 10


# ------------------------------------------
# 2. 终端兼容性与渲染 (Terminal & Render)
# ------------------------------------------
# 开启真彩色支持，完美适配 Catppuccin 主题与 Ghostty 渲染
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -a terminal-features '*:RGB'

# 允许 Neovim 透传光标形状控制 (Insert 模式细线 / Normal 模式方块)
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[2 q'


# ------------------------------------------
# 3. 窗口与面板管理 (Windows & Panes)
# ------------------------------------------
# 窗口和面板起始序号从 1 开始 (符合键盘物理按键直觉，离左手更近)
set -g base-index 1
setw -g pane-base-index 1

# 当关闭一个窗口时，自动重新编号剩余的窗口，保持序号连续
set -g renumber-windows on

# 动态命名格式设定: /文件夹名:运行命令 (例如 /src:nvim)
set-option -g automatic-rename-format '/#{b:pane_current_path}:#{pane_current_command}'


# ------------------------------------------
# 4. 外观主题与 UI (Theme & UI)
# ------------------------------------------
# 完美融合 Catppuccin 暗色风格的选中高亮底色 (用于 choose-tree 和复制模式)
set-window-option -g mode-style "bg=#313244,fg=#cdd6f4"


# ------------------------------------------
# 5. 快捷键绑定 (Keybindings)
# ------------------------------------------
# 增强版 w 键: 树状交互视图 (增强路径的洋红高亮显示，信息密度最大化)
bind-key w choose-tree -Zw -F "#{?pane_format,#[fg=cyan]#{pane_current_command} #[fg=magenta]#{pane_current_path},#{?window_format,#[fg=green]#{window_name}#{window_flags} #[fg=cyan](#{pane_current_command}) #[fg=magenta]#{pane_current_path},#[fg=blue,bold]#{session_name} #[fg=gray](#{session_windows} 窗口)#{?session_attached, (活跃),} #[fg=gray]启动
