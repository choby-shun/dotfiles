# ==========================
# 核心设置 & 修复 Ghostty/Nvim 兼容性
# ==========================

# 1. 开启真彩色 (True Color) 支持，解决 Catppuccin 颜色黯淡问题
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -a terminal-features '*:RGB'

# 2. 允许 Neovim 透传光标形状控制 (方块/细线切换)
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[2 q'

# 3. 开启鼠标支持 (极其重要：允许用鼠标调整分屏大小、点击切换窗口)
set -g mouse on

# 4. 消除 Neovim 中按下 ESC 键的延迟 (tmux 默认有 500ms 等待时间)
set -sg escape-time 10

# 5. 窗口和面板的起始序号从 1 开始 (默认是 0，但在键盘上 1 离左手更近，更符合直觉)
set -g base-index 1
setw -g pane-base-index 1

# 6. 当关闭一个窗口时，自动重新编号剩余的窗口
set -g renumber-windows on

# 重新绑定 w 键，增强 choose-tree 的信息密度和颜色
bind-key w choose-tree -Zw -F "#{?pane_format,#[fg=cyan]#{pane_current_command} #[fg=gray]#{pane_current_path},#{?window_format,#[fg=green]#{window_name}#{window_flags} #[fg=cyan](#{pane_current_command}) #[fg=gray]#{pane_current_path},#[fg=blue,bold]#{session_name} #[fg=gray](#{session_windows} 窗口)#{?session_attached, (活跃),} #[fg=gray]启动于: #{t:session_created}}}"

# change default name to path:/command
set-option -g automatic-rename-format '/#{b:pane_current_path}:#{pane_current_command}'
